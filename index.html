<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkview Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="preload" as="image" href="Images/p8.jpg">

    <style>
        html { scroll-behavior: smooth; }
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: #fafafa; 
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        
        nav { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 20px 50px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        nav ul li { margin: 0 20px; }

        nav ul li a {
            color: #222;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #d35400;
            transition: width 0.3s ease;
        }

        nav ul li a:hover { color: #d35400; }
        nav ul li a:hover::after { width: 100%; }

        #check { display: none; }

        
        .checkbtn {
            font-size: 32px;
            color: #222;
            cursor: pointer;
            display: none; 
            position: fixed; 
            right: 25px;
            top: 15px;
            z-index: 1001; 
            line-height: 1;
        }
        .checkbtn::after { content: "\2630"; font-family: sans-serif; } 
        #check:checked ~ .checkbtn::after { content: "\2715"; } 

        header {
            position: relative;
            height: 100vh;
            min-height: 500px;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url('Images/p8.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.5);
            animation: fadeInDown 1s ease-out;
        }

        header p {
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 10px;
            letter-spacing: 3px;
            color: #e0e0e0;
            animation: fadeInUp 1s ease-out 0.5s both;
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        
        @keyframes imageFade {
            from { opacity: 0; filter: blur(5px); }
            to { opacity: 1; filter: blur(0); }
        }

        .container { 
            max-width: 1200px; 
            margin: auto; 
            padding: 60px 20px 30px; 
        }
        
        .section-title { text-align: center; margin-bottom: 50px; }
        
        .packages-title { margin-top: 80px; }

        .section-title h2 { 
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #222;
            margin: 0;
            position: relative;
            display: inline-block;
        }
        .section-title h2::after {
            content: '';
            width: 60px;
            height: 3px;
            background: #d35400;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .gallery { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            justify-content: center;
        }

        .gallery img { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            border-radius: 12px; 
            background-color: #eee; 
            transition: all 0.4s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            animation: imageFade 0.8s ease-in-out forwards;
        }
        
        .gallery img:hover {
            transform: translateY(-10px) scale(1.02); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            filter: brightness(110%);
        }

        .services { 
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .card { 
            background: #fff; 
            padding: 40px 30px; 
            flex: 1; 
            min-width: 280px;
            text-align: center; 
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }
        
        .card:hover {
            box-shadow: 0 20px 40px rgba(0,0,0,0.12); 
            transform: translateY(-10px); 
        }

        .card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #222;
        }

        .card p {
            color: #d35400; 
            font-weight: 700; 
            font-size: 1.8rem;
            margin: 0;
        }

        footer { 
            background: #1a1a1a; 
            color: #fff; 
            text-align: center; 
            padding: 30px 20px; 
            margin-top: 0; 
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
       
        
        @media (max-width: 850px) {
            .checkbtn { display: block; }
            
            nav { background: #fff; }
            
            nav ul {
                display: flex; 
                flex-direction: column;
                justify-content: flex-start;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                height: 100vh;
                max-height: 0; 
                overflow: hidden; 
                transition: max-height 0.4s ease-in-out; 
                background: #fff;
                padding: 0;
                box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            }

            nav ul li { display: block; width: 100%; text-align: center; margin: 0; }
            nav ul li a { display: block; padding: 20px; border-bottom: 1px solid #f0f0f0; color: #222; }
            #check:checked ~ nav ul { max-height: 100vh; padding-top: 20px; }

            
            header { 
                background-attachment: scroll; 
                background-position: center center;
                height: 60vh;
                min-height: 400px;
            }

            header h1 { font-size: 2.8rem; }
            header p { font-size: 1rem; }
           
            
            .gallery { 
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
                gap: 12px; 
            }
            .container { padding: 30px 15px 20px; } 
            
            .card { flex: 0 0 100%; min-width: unset; }
            .packages-title { margin-top: 40px; }
        }
    </style>
</head>
<body>

<input type="checkbox" id="check">
<label for="check" class="checkbtn"></label>

<nav>
    <ul>
        <li><a href="#home-top">Home</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#services">Packages</a></li>
        <li><a href="#about">About Us</a></li>
    </ul>
</nav>

<header id="home-top">
    <h1>Parkview Studio</h1>
    <p>Capturing Moments Beautifully</p>
</header>

<div class="container">
    <div class="section-title">
        <h2 id="gallery">Our Work</h2>
    </div>
    
    <div class="gallery">
        <img src="Images/p1.jpg" alt="1" loading="lazy">
        <img src="Images/p3.jpg" alt="2" loading="lazy">
        <img src="Images/p4.jpg" alt="3" loading="lazy">
        <img src="Images/p5.jpg" alt="4" loading="lazy">
        <img src="Images/p6.jpg" alt="5" loading="lazy">
        <img src="Images/p7.jpg" alt="6" loading="lazy">
    </div>

    <div class="section-title packages-title">
        <h2 id="services">Photography Packages</h2>
    </div>

    <div class="services">
        <div class="card">
            <h3>Basic Shoot</h3>
            <p>₹1999</p>
        </div>
        <div class="card">
            <h3>Standard Shoot</h3>
            <p>₹3999</p>
        </div>
        <div class="card">
            <h3>Premium Shoot</h3>
            <p>₹9999</p>
        </div>
    </div>
</div>

<footer id="about">
    <p>© 2026 Parkview Studio | All Rights Reserved</p>
</footer>

</body>
</html>

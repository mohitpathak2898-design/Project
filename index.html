<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkview Studio | Capture Your Moments</title>
    <style>
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            }

        body { 
               background-color: #f4f4f4; 
               color: #333; 
              }

        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: white;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { 
         font-size: 1.5rem; 
         font-weight: bold; 
         letter-spacing: 2px; 
         color: #f39c12; 
           }
        
        .nav-links { 
         display: flex; 
         list-style: none; 
          }

        .nav-links li { 
         margin-left: 20px; 
         }

        .nav-links a { 
         color: black; 
         text-decoration: none; 
         font-size: 1rem; 
         transition: 0.3s; 
          }

        .nav-links a:hover { 
         color: #f39c12; 
           }

        
        #menu-toggle { 
        display: none; 
          }

        .hamburger { 
         display: none; 
         cursor: pointer; 
         font-size: 25px; 
          }

        
        .hero {
            height: 90vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1542038784456-1ea8e935640e?ixlib=rb-                       1.2.1&auto=format&fit=crop&w=1600&q=80') center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }
        .hero-content h1 { 
         font-size: 3.5rem; 
         margin-bottom: 15px; 
          }

        .hero-content p { 
         font-size: 1.2rem; 
         margin-bottom: 25px; 
          }

        .btn { 
         padding: 12px 30px; 
         background: #f39c12; 
         color: #fff; 
         text-decoration: none; 
         border-radius: 5px; 
         font-weight: bold; 
         }

        
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .nav-links {
                position: absolute;
                top: 70px;
                left: -100%;
                flex-direction: column;
                background: #000;
                width: 100%;
                height: 90vh;
                text-align: center;
                transition: 0.5s;
                padding-top: 50px;
            }
            .nav-links li { margin: 20px 0; }
            
            
            #menu-toggle:checked ~ .nav-links { left: 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">PARKVIEW STUDIO</div>
        
        
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="hamburger">&#9776;</label>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Packages</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Capture Your Best Moments</h1>
            <p>Timeless photography for every special occasion.</p>
            <a href="#" class="btn">View Gallery</a>
        </div>
    </section>

</body>
</html>

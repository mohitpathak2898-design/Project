<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    
    <!-- Sabse fast loading ke liye saari images ko pehle se fetch karne ka order -->
    <link rel="preload" as="image" href="Images/p9.jpg">
    <link rel="preload" as="image" href="Images/p15.jpg">
    <link rel="preload" as="image" href="Images/p14.jpg">
    <link rel="preload" as="image" href="Images/p10.jpg">
    <link rel="preload" as="image" href="Images/p11.jpg">
    <link rel="preload" as="image" href="Images/p12.jpg">
    <link rel="preload" as="image" href="Images/p13.jpg">

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background-color: #f4f4f4; 
            color: #333; 
        }

        .page-header {
            background-color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 2.8rem;
            color: #222;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .gallery-container {
            padding: 20px 5% 60px;
            text-align: center;
            min-height: calc(100vh - 200px); 
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            background: #fff; 
        }

        /* Koi delay ya animation nahi, direct photo dikhegi */
        .gallery-item img {
            width: 100%;
            height: 350px;
            object-fit: cover; 
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 25px 20px;
            font-size: 0.9rem;
        }

        .footer span {
            color: #f39c12;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2rem;
            }
            .gallery-container {
                padding: 10px 5% 40px;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 15px;
            }
            .gallery-item img {
                height: 300px; 
            }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <h1>Photo Gallery</h1>
    </header>

    <section class="gallery-container">
        <div class="gallery-grid">
            
            <!-- loading="eager" aur fetchpriority="high" dono lagaye hain -->
            <div class="gallery-item">
                <img src="Images/p9.jpg" alt="Beautiful Wedding Couple" loading="eager" fetchpriority="high">
            </div>
            
            <div class="gallery-item">
                <img src="Images/p15.jpg" alt="Male Modelling Shoot" loading="eager" fetchpriority="high">
            </div>

            <div class="gallery-item">
                <img src="Images/p14.jpg" alt="Outer Shoot" loading="eager" fetchpriority="high">
            </div>

            <div class="gallery-item">
                <img src="Images/p10.jpg" alt="Pre Wedding Shoot" loading="eager" fetchpriority="high">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?q=60&w=600&auto=format&fit=crop" alt="Fashion and Lifestyle" loading="eager" fetchpriority="high">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=60&w=600&auto=format&fit=crop" alt="Male Portrait" loading="eager" fetchpriority="high">
            </div>

            <div class="gallery-item">
                <img src="Images/p11.jpg" alt="Modelling" loading="eager" fetchpriority="high">
            </div>

            <div class="gallery-item">
                <img src="Images/p12.jpg" alt="Monuments" loading="eager" fetchpriority="high">
            </div>

            <div class="gallery-item">
                <img src="Images/p13.jpg" alt="Monuments" loading="eager" fetchpriority="high">
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 <span>Parkview Studio</span>. All rights reserved.</p>
    </footer>

</body>
</html>

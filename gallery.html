<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkview Studio | Photo Gallery</title>
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: Arial, sans-serif; 
        }

        body { 
            background-color: #f4f4f4; 
            color: #333; 
        }
        
        .nav-header {
            background-color: #f1f1f1;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: orange;
        }

        .back-link {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
        }
        
        .page-header {
            background-color: #fff;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid #ddd;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .gallery-container {
            padding: 20px 5% 60px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            overflow: hidden;
            background: #fff; 
            border: 5px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        
        .gallery-item img {
            width: 100%;
            height: 350px;
            object-fit: cover; 
            display: block;
            transition: 0.5s ease;
            filter: grayscale(40%); 
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: grayscale(0%); 
        }
        
        #popup-window {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            z-index: 100; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer;
            padding: 20px;
        }

        #popup-img {
            max-width: 100%; 
            max-height: 100%; 
            border: 5px solid white;
            object-fit: contain;
        }

        .footer {
            background-color: #111;
            color: #aaa;
            text-align: center;
            padding: 30px 20px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .footer span {
            color: #f39c12;
            font-weight: 600;
        }

        
        
        
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 15px;
            }
            .gallery-item img {
                height: 300px; 
            }
        }

        
        @media (max-width: 480px) {
            .nav-header {
                padding: 15px 10px;
            }
            .logo {
                font-size: 20px;
            }
            .back-link {
                font-size: 14px;
            }
            .page-header {
                padding: 25px 15px;
            }
            .page-header h1 {
                font-size: 1.5rem;
            }
            .gallery-container {
                padding: 15px 5% 40px;
            }
            .gallery-grid {
                grid-template-columns: 1fr; 
            }
            .gallery-item img {
                height: 250px; 
            }
        }

    </style>
</head>
<body>

    <header class="nav-header">
        <div class="logo">PARKVIEW <span>STUDIO</span></div>
        <a href="index.html" onclick="window.history.back(); return false;" class="back-link">Back to Home</a>
    </header>

    <div class="page-header">
        <h1>Photo Gallery</h1>
    </div>

    <section class="gallery-container">
        <div class="gallery-grid">
            <div class="gallery-item"><img src="Images/p9.jpg" alt="Wedding"></div>
            <div class="gallery-item"><img src="Images/p15.jpg" alt="Modelling"></div>
            <div class="gallery-item"><img src="Images/p14.jpg" alt="Outer Shoot"></div>
            <div class="gallery-item"><img src="Images/p10.jpg" alt="Pre Wedding"></div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?q=60&w=600&auto=format&fit=crop" alt="Fashion">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=60&w=600&auto=format&fit=crop" alt="Portrait">
            </div>
            
            <div class="gallery-item"><img src="Images/p11.jpg" alt="Modelling"></div>
            <div class="gallery-item"><img src="Images/p12.jpg" alt="Monuments"></div>
            <div class="gallery-item"><img src="Images/p13.jpg" alt="Monuments"></div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 <span>Parkview Studio</span>. All rights reserved.</p>
    </footer>

    <div id="popup-window">
        <img id="popup-img" src="" alt="Popup Image">
    </div>
    
    <script>
        var popup = document.getElementById("popup-window");
        var popupImage = document.getElementById("popup-img");
        var allImages = document.querySelectorAll(".gallery-item img");
        
        for (var i = 0; i < allImages.length; i++) {
            allImages[i].onclick = function() {
                popup.style.display = "flex"; 
                popupImage.src = this.src;    
            }
        }
        
        popup.onclick = function() {
            popup.style.display = "none";
        }
    </script>

</body>
</html>
